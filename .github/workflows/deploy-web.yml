name: Publicar Bob Live Web (Godot)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-web.yml"
      - "upstream"
      - ".gitmodules"
      - "scripts/prepare_web.py"
      - "site/**"
      - "deploy/render/**"
      - "render.yaml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: bob-live-pages
  cancel-in-progress: false

jobs:
  build:
    name: Validar e exportar Godot WebGL
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Baixar submodulo original
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: upstream/server/package-lock.json

      - name: Rodar testes do servidor original
        run: |
          npm ci --prefix upstream/server
          npm test --prefix upstream/server
          node --check site/main.js

      - name: Preparar modificacoes Godot Web e Node
        run: |
          python3 scripts/prepare_web.py
          node --check .generated/server/src/bridge.js
          node --check scripts/public_bridge.js
          npm ci --prefix .generated/server
          node scripts/test_public_bridge.js
          python3 scripts/test_web_adapter.py

      - name: Baixar Godot 4.7.2 e templates Web
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          curl -fL --retry 3 "$base/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          sudo mv /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 "$base/Godot_v4.7.2-stable_export_templates.tpz" -o /tmp/godot-templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q -j /tmp/godot-templates.tpz 'templates/web*.zip' -d "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          godot --headless --version

      - name: Importar assets e exportar projeto Web
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/game
          godot --headless --path .generated/game --import 2>&1 | tee /tmp/godot-import.log
          if grep -Eq "SCRIPT ERROR|Failed to load script|Parse Error|Compile Error" /tmp/godot-import.log; then
            echo "::error::Erro GDScript na importacao"
            exit 1
          fi
          godot --headless --path .generated/game --export-release "Web" "$GITHUB_WORKSPACE/site/game/index.html" 2>&1 | tee /tmp/godot-export.log
          if grep -Eq "SCRIPT ERROR|Failed to load script|Parse Error|Compile Error" /tmp/godot-export.log; then
            echo "::error::Erro GDScript na exportacao"
            exit 1
          fi
          test -s site/game/index.html
          test -s site/game/index.wasm
          test -s site/game/index.pck
          echo "Export HTML5 criado:"
          du -h site/game/* | tail -n 12

      - name: Preparar Docker Buildx para imagem web 24h
        uses: docker/setup-buildx-action@v3
      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar imagem do jogo Web para VM ARM64 ou AMD64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/danilo631/bob-live-web:latest

      - name: Publicar pacote Web estático para Render
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          (cd site && zip -qr "$RUNNER_TEMP/bob-live-web.zip" .)
          if ! gh release view web-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create web-latest --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Bob Live Web (build estável)" \
              --notes "Export Godot WebGL e página pública. Distribuído com créditos ao projeto original."
          fi
          gh release upload web-latest "$RUNNER_TEMP/bob-live-web.zip" --clobber --repo "$GITHUB_REPOSITORY"
          echo "Release Web atualizado para hospedagem no Render."
      - name: Atualizar site Render após release (se hook configurado)
        env:
          RENDER_STATIC_DEPLOY_HOOK: ${{ secrets.RENDER_STATIC_DEPLOY_HOOK }}
        run: |
          if [[ -n "$RENDER_STATIC_DEPLOY_HOOK" ]]; then
            curl -fLsS --retry 2 --max-time 25 -X POST "$RENDER_STATIC_DEPLOY_HOOK"
          fi
      - name: Enviar artefato Web, mesmo sem Pages ativado
        uses: actions/upload-artifact@v4
        with:
          name: bob-live-web
          path: site/
          if-no-files-found: error
          retention-days: 14

  deploy:
    # Opcional: use somente quando o Pages estiver habilitado no repositorio.
    # Unico frontend no Render. Pages guarda somente JSON estatico de treinamento.
    if: vars.ENABLE_GITHUB_PAGES == 'true'
    name: Publicar base de conhecimento no GitHub Pages (sem segundo site)
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Recuperar apenas dados publicos do cerebro
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publicar dados, nunca uma segunda copia do jogo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pages-assets/brain
          cp brain/intents.json pages-assets/brain/intents.json
          printf '%s\n' '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=https://bob-live-web-nexttec.onrender.com/"><a href="https://bob-live-web-nexttec.onrender.com/">Abrir Bob Live</a>' > pages-assets/index.html
      - name: Empacotar apenas JSON de conhecimento para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-assets
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
